name: Tethwork
options:
  bundleIdPrefix: app.tethwork
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Tethwork:
    type: application
    platform: macOS
    sources:
      - path: Tethwork
        excludes:
          # Local backup copies are intentionally not part of the app target.
          - "**/* (2).swift"
          - NetSyncApp.swift
    dependencies:
      - sdk: QuickLook.framework
      - sdk: QuickLookThumbnailing.framework
      - sdk: QuickLookUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tethwork.Tethwork
        PRODUCT_NAME: Tethwork
        INFOPLIST_FILE: Tethwork/Info.plist
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Tethwork/Tethwork.entitlements
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        AD_HOC_CODE_SIGNING_ALLOWED: true
