name: Tethwork
options:
  bundleIdPrefix: app.tethwork
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  knownRegions:
    - en
    - Base
    - ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "5"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Tethwork:
    type: application
    platform: macOS
    sources:
      - path: Tethwork
    dependencies:
      - package: Sparkle
      - sdk: QuickLook.framework
      - sdk: QuickLookThumbnailing.framework
      - sdk: QuickLookUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tethwork.Tethwork
        PRODUCT_NAME: Tethwork
        INFOPLIST_FILE: Tethwork/Info.plist
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Tethwork/Tethwork.entitlements
        # Ad-hoc signing cannot use the hardened runtime, so Xcode silently
        # disabled it. Keep the build honest until a Developer ID is configured;
        # distribution builds should flip this to true (see README).
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Keep every legacy ICNS size (through 512 pt @2x) alongside the
        # Icon Composer asset, rather than Xcode's default 256 px maximum.
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
        CODE_SIGN_IDENTITY: "-"
        AD_HOC_CODE_SIGNING_ALLOWED: true
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: true
          DEVELOPMENT_TEAM: 4Y3FA3437G
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application: Iurii Stegnii (4Y3FA3437G)"
  TethworkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TethworkTests
    dependencies:
      - target: Tethwork
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        AD_HOC_CODE_SIGNING_ALLOWED: true
schemes:
  Tethwork:
    build:
      targets:
        Tethwork: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TethworkTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
